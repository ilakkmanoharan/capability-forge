<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Member servicing</title>
<style>body{margin:30px;font:16px Georgia;color:#162f24}h1{font-size:28px}table{border-collapse:collapse;width:100%;max-width:850px}td,th{padding:15px;border:1px solid #a5b4aa;text-align:left}th{background:#e6ece8}input,select,button{font:inherit;padding:9px}button{cursor:pointer;background:#163c2b;color:white;border:0}a{color:#163c2b}aside{margin-top:28px;font:13px Arial;color:#526358}dialog{padding:30px;border:1px solid #526358}</style></head>
<body><h1>Member servicing</h1><p>Training sandbox. All records are fictional.</p>
<label for="scenario">Runtime scenario</label> <select id="scenario"><option value="normal">Normal</option><option value="permission">Permission denied</option><option value="expired">Session expired</option><option value="slow">Slow load</option><option value="dialog">Unexpected dialog</option><option value="known">Known interstitial</option><option value="app-error">Application error</option><option value="ambiguous">Ambiguous target</option></select>
<hr><main></main><aside>Legacy surface fixture: framed screens, table layout, no test IDs.</aside>
<dialog><h2>Operator notice</h2><p>Review this unexpected notice before continuing.</p><button>Dismiss notice</button></dialog>
<script type="module">
import {lookupMember,readAccount} from "/domain.js";
const main=document.querySelector('main'), scenario=document.querySelector('select'), dialog=document.querySelector('dialog');

let current;
function search(){main.innerHTML='<h2>Member search</h2><form><table><tr><th><label for="member">Member ID</label></th><td><input id="member" name="member" required pattern="[0-9]{5}" maxlength="5"></td></tr><tr><td colspan="2"><button>Search members</button></td></tr></table></form><section aria-live="polite"></section>';main.querySelector('form').onsubmit=async e=>{e.preventDefault();current=main.querySelector('input').value;const section=main.querySelector('section');section.textContent='Loading';if(scenario.value==='slow')await new Promise(r=>setTimeout(r,2500));if(scenario.value==='permission'){section.innerHTML='<h2>Permission denied</h2>';return}if(scenario.value==='expired'){section.innerHTML='<h2>Session expired</h2><button>Restore demo session</button>';section.querySelector('button').onclick=()=>{scenario.value='normal';section.textContent='Session restored. Search again.'};return}if(scenario.value==='app-error'){section.innerHTML='<h2>App error</h2>';return}if(['dialog','known'].includes(scenario.value)){dialog.dataset.kind=scenario.value==='known'?'known':'unknown';dialog.querySelector('button').textContent=scenario.value==='known'?'Acknowledge service notice':'Dismiss notice';dialog.showModal();}if(lookupMember(current).status!=='found'){section.innerHTML='<h2>Member not found</h2>';return}section.innerHTML='<h2>Search results</h2><table><tr><th>Member ID</th><th>Action</th></tr><tr><td></td><td><button>Open member</button></td></tr></table>';section.querySelector('td').textContent=current;section.querySelector('button').onclick=detail;if(scenario.value==='ambiguous'){const duplicate=section.querySelector('button').cloneNode(true);duplicate.onclick=detail;section.append(duplicate);}}}
function detail(){main.innerHTML='<h2>Member detail</h2><p>Member ID: <strong></strong></p><table><tr><th>Account</th><th>Action</th></tr><tr><td>Savings</td><td><button>Savings details</button></td></tr><tr><td>Checking</td><td><button>Checking details</button></td></tr></table><p><button>Back to search</button></p>';main.querySelector('strong').textContent=current;const buttons=main.querySelectorAll('button');buttons[0].onclick=()=>account('Savings');buttons[1].onclick=()=>account('Checking');buttons[2].onclick=search}
function account(type){main.innerHTML='<h2>Account detail</h2><table><tr><th>Member ID</th><td></td></tr><tr><th>Account type</th><td></td></tr><tr><th>Current balance</th><td></td></tr><tr><th>Currency</th><td>USD</td></tr></table><p><button>Back to member</button></p>';const cells=main.querySelectorAll('td');cells[0].textContent=current;cells[1].textContent=type;cells[2].textContent=readAccount(current,type).outputs.balance;main.querySelector('button').onclick=detail}
dialog.querySelector('button').onclick=()=>dialog.close();search();
</script></body></html>
